version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    volumes:
      - ./cache:/app/cache
      - ./models/trained_models:/app/models/trained_models
      - ./f1_api.log:/app/f1_api.log
    environment:
      - FLASK_APP=run.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5002

  frontend:
    build:
      context: ./f1w-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5002
    ports:
      - "3000:3000"
    depends_on:
      - backend
